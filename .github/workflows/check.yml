name: Check plugin
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s plugins/obsidian-research/tests -v
      - run: python package.py
      - run: python -c 'import glob,json,zipfile; p=glob.glob("dist/obsidian-research-*.zip"); assert len(p)==1; z=zipfile.ZipFile(p[0]); assert "plugin.json" in z.namelist(); json.loads(z.read("plugin.json"))'
